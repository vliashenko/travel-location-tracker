<div class="wishlist-page">
    <div class="header">
        <h1>Обране (Wishlist)</h1>
        <p>Збережені локації для майбутніх відвідувань</p>
    </div>

    <main class="content-container">
        <div class="results-list">
            @for (place of savedPlaces(); track place.id) {
            <app-card [place]="place" [state]="{ isSelected: false, isSaved: true }"
                (toggleWishlist)="toggleWishlist($event)">
            </app-card>
            } @empty {
            <div class="empty-results">
                <p>Ваш список обраного порожній.</p>
            </div>
            }
        </div>
    </main>
</div>
