<div class="tracker-page">
    <header class="header">
        <h1>Пошук місць</h1>
        <p>Знайдіть цікаві локації та додавайте їх до власного списку</p>
    </header>

    <section class="search-section">
        <app-search-places (placesFound)="onPlacesFound($event)" (loadingChanged)="onLoadingChanged($event)">
        </app-search-places>
    </section>

    @defer (when !isLoading()) {
    <main class="content-grid">
        <app-places-list [places]="places()" [selectedPlace]="selectedPlace()" (selectPlace)="selectPlace($event)">
        </app-places-list>

        <aside class="details-sidebar">
            <app-place-details [place]="selectedPlace()"></app-place-details>
        </aside>
    </main>
    } @loading {
    <div class="loading-state">
        <div class="spinner"></div>
        <p>Завантаження даних...</p>
    </div>
    }
</div>
