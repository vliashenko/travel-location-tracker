<div class="tracker-page">
    <header class="header">
        <h1>Пошук місць</h1>
        <p>Знайдіть цікаві локації та додавайте їх до власного списку</p>
    </header>

    <section class="search-section">
        <app-search-places (placesFound)="onPlacesFound($event)" (loadingChanged)="onLoadingChanged($event)">
        </app-search-places>
    </section>

    @if (!isLoading) {
    <main class="content-grid">

        @if (places.length > 0){
        <div class="results-list">
            @for (place of places; track place.id) {
            @if (selectedPlace?.id) {
            <app-card [place]="place" [state]="{ isSelected: selectedPlace.id === place.id, isSaved: isSaved(place) }"
                (selectCard)="selectPlace($event)" (toggleWishlist)="toggleWishlist($event)">
            </app-card>
            }
            }
        </div>
        } @else {
        <div>
            <div class="empty-results">
                <p>Не знайдено жодного місця. Спробуйте інший запит.</p>
            </div>
        </div>
        }

        <aside class="details-sidebar">
            <app-place-details [place]="selectedPlace"></app-place-details>
        </aside>

    </main>

    } @else {
    <div>
        <div class="loading-state">
            <div class="spinner"></div>
            <p>Завантаження даних...</p>
        </div>
    </div>
    }


</div>
