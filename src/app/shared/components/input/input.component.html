<mat-form-field appearance="outline" class="full-width" subscriptSizing="dynamic">
    <mat-label>{{ label() }}</mat-label>

    @if (icon()) {
    <mat-icon matPrefix>{{ icon() }}</mat-icon>
    }

    <input matInput [placeholder]="placeholder()" [value]="value()" [disabled]="disabled()" (input)="onInput($event)"
        (blur)="onBlur()" (keyup.enter)="enterPressed.emit()" />
</mat-form-field>
